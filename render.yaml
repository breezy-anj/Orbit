services:
  - type: web
    name: orbit-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && pip install numpy scikit-learn --quiet 2>/dev/null || true
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: orbit-db
    plan: free
    region: oregon
    databaseName: orbit
